<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lokma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<meta name="description" content="Lokma: fotoğraftan kalori ve makro tahmini yapan, Türk mutfağına özel beslenme koçu. AI calorie tracker for Turkish food.">
<meta name="theme-color" content="#F3F5EE">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23B8283F%22/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: tek sütunlu telefon uygulaması, üstte günlük özet halkası, altta sabit sekme çubuğu */
:root{
  --bg:#F3F5EE; --surface:#FFFFFF; --sunk:#E8ECE0; --fg:#18231A; --muted:#5E6B5F; --line:#D5DBCB;
  --accent:#B8283F; --accent-ink:#FFFFFF; --olive:#3E5C2F;
  --prot:#2F6FB0; --carb:#C98A12; --fat:#7A4FA0;
  --ok:#2E7D4F; --warn:#B26A00;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121712; --surface:#1B221C; --sunk:#232C24; --fg:#E9EEE4; --muted:#9BA897; --line:#334033;
  --accent:#F0657B; --accent-ink:#1A0B0E; --olive:#9CC27F;
  --prot:#7DB3EA; --carb:#EDB548; --fat:#BC94E0; --ok:#6CCB92; --warn:#F0B354; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121712; --surface:#1B221C; --sunk:#232C24; --fg:#E9EEE4; --muted:#9BA897; --line:#334033;
  --accent:#F0657B; --accent-ink:#1A0B0E; --olive:#9CC27F;
  --prot:#7DB3EA; --carb:#EDB548; --fat:#BC94E0; --ok:#6CCB92; --warn:#F0B354; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;transform:translateY(-3px)}
.date{font-size:13px;color:var(--muted)}
.banner{background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner button{flex:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.summary{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}
@media (max-width:380px){.summary{grid-template-columns:1fr;justify-items:center}}
.ring{position:relative;width:140px;height:140px}
.ring svg{width:140px;height:140px;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.ring .lbl{font-size:12px;color:var(--muted)}
.macros{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
.macro .row{display:flex;justify-content:space-between;font-size:13px}
.macro .row b{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.goalchip{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--olive)}
.meals{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .name{min-width:0}
.meal .name b{font-weight:600;display:block;overflow-wrap:anywhere}
.meal .kcal{font-weight:700;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.iconbtn{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:6px;border-radius:8px;cursor:pointer}
.iconbtn:hover{color:var(--accent);background:var(--sunk)}
button,.btn{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.pick:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.primary:disabled{opacity:.5;cursor:not-allowed}
.full{width:100%}
.coach{background:color-mix(in srgb,var(--olive) 10%,var(--surface));border-color:color-mix(in srgb,var(--olive) 35%,var(--line))}
.coach .out{white-space:pre-wrap;font-size:14.5px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;padding:9px 10px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:1fr 1fr}}
label.pick{border:2px dashed var(--line);border-radius:var(--r);padding:22px 14px;text-align:center;cursor:pointer;color:var(--fg);font-size:15px;align-items:center;background:var(--bg)}
label.pick input{position:absolute;opacity:0;width:1px;height:1px}
.preview{border-radius:12px;max-height:240px;object-fit:cover;width:100%}
.tabsmall{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.tabsmall button{flex:1;border:0;background:none;padding:8px;font-size:14px}
.tabsmall button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.item{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .mac{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.status{font-size:14px;color:var(--muted)}
.err{color:var(--accent);font-size:14px}
.menu-day{display:flex;flex-direction:column}
.dish{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dish:first-child{border-top:0}
.dish .best{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ok)}
.add{width:36px;height:36px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:var(--sunk);border-color:transparent}
.add:hover{background:var(--accent);color:var(--accent-ink)}
.calc{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.calc dt{color:var(--muted)}
.calc dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.calc .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700;color:var(--fg)}
.note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;max-width:90vw}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 4px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button.plus span.c{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.wiz{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wiz .in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:22px}
.wizbar{display:flex;align-items:center;gap:10px}
.wizbar .iconbtn{font-size:22px;color:var(--fg)}
.prog{flex:1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--fg);border-radius:99px}
.wq{display:flex;flex-direction:column;gap:6px}
.wq h2{font-size:28px;font-weight:800}
.wizbody{display:flex;flex-direction:column;gap:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;display:flex;align-items:center;padding:15px 16px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:16px}
.opt .sub{display:block;font-weight:400;font-size:13.5px;opacity:.75;margin-top:2px}
.opt[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.biglbl{align-items:stretch}
.bigrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px 16px}
.bigin{font-family:var(--display);font-size:38px;font-weight:700;border:0;background:none;padding:8px 0;text-align:left;flex:1;min-width:0}
.bigin:focus-visible{outline:none}
.bigrow:focus-within{border-color:var(--fg)}
.unit{font-size:18px;font-weight:600;color:var(--muted)}
.wizfoot{margin-top:auto;position:sticky;bottom:0;padding-top:12px;background:var(--bg)}
.wizfoot button{padding:15px;font-size:16px;border-radius:14px}
.plan-big{font-family:var(--display);font-size:56px;font-weight:800;line-height:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 div{display:flex;flex-direction:column;background:var(--sunk);border-radius:12px;padding:10px 4px}
.grid3 b{font-size:18px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .3s ease}.bar i{transition:width .5s ease}.ring circle{transition:stroke-dashoffset .6s ease}}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.lang{display:flex;background:var(--sunk);border-radius:99px;padding:3px}
.lang button{border:0;background:none;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:99px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="dot"></span><h1>Lokma</h1></div>
    <div class="hright">
      <span class="date" id="today"></span>
      <div class="lang" role="group" data-i18n-aria="lang_aria">
        <button type="button" data-lang="tr" aria-pressed="true">TR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <div class="banner" id="demoBanner" hidden>
    <span><b data-i18n="banner_b"></b> <span data-i18n="banner_s"></span></span>
    <button class="primary" id="startWiz" type="button" data-i18n="create_profile"></button>
  </div>

  <!-- TODAY -->
  <section id="v-bugun" class="view">
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="panel">
        <div class="top"><h2 data-i18n="today_h"></h2><span class="goalchip" id="goalChip"></span></div>
        <div class="summary">
          <div class="ring" data-i18n-aria="ring_aria">
            <svg viewBox="0 0 140 140" aria-hidden="true">
              <circle cx="70" cy="70" r="60" fill="none" stroke="var(--sunk)" stroke-width="12"/>
              <circle id="ringFg" cx="70" cy="70" r="60" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377"/>
            </svg>
            <div class="center"><span class="big num" id="kcalLeft">0</span><span class="lbl" id="kcalLeftLbl"></span></div>
          </div>
          <div class="macros" id="macroBars"></div>
        </div>
        <p class="small muted num" id="kcalLine"></p>
      </div>

      <div class="panel coach">
        <div class="top"><h3 data-i18n="coach_h"></h3><span class="tag" data-i18n="ai_tag"></span></div>
        <p class="coach-out out" id="coachOut"></p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="primary" id="coachBtn" data-i18n="coach_btn"></button>
          <button id="coachStop" hidden data-i18n="stop"></button>
        </div>
        <p class="err" id="coachErr" hidden></p>
      </div>

      <div class="panel">
        <div class="top"><h3 data-i18n="meals_h"></h3><span class="small muted num" id="mealCount"></span></div>
        <div class="meals" id="mealList"></div>
        <button class="full" data-go="ekle" data-i18n="add_meal_btn"></button>
      </div>
    </div>
  </section>

  <!-- ADD -->
  <section id="v-ekle" class="view" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <h2 data-i18n="add_h"></h2>
      <div class="tabsmall" role="group" data-i18n-aria="method_aria">
        <button data-mode="foto" aria-pressed="true" data-i18n="m_photo"></button>
        <button data-mode="yazi" aria-pressed="false" data-i18n="m_text"></button>
        <button data-mode="elle" aria-pressed="false" data-i18n="m_manual"></button>
      </div>

      <div class="panel" id="m-foto">
        <label class="pick" id="pickLbl">
          <input type="file" id="photo" accept="image/*" capture="environment">
          <span><b data-i18n="pick_b"></b><br><span class="small muted" data-i18n="pick_s"></span></span>
        </label>
        <img id="prev" class="preview" data-i18n-alt="prev_alt" alt="" hidden>
        <div>
          <p class="small" style="font-weight:600;color:var(--muted);margin-bottom:6px" data-i18n="sofra_q"></p>
          <div class="seg" id="persons" role="group" data-i18n-aria="persons_aria">
            <button aria-pressed="true" data-p="1" data-i18n="just_me"></button>
            <button aria-pressed="false" data-p="2">2</button>
            <button aria-pressed="false" data-p="3">3</button>
            <button aria-pressed="false" data-p="4">4</button>
            <button aria-pressed="false" data-p="6">5+</button>
          </div>
          <p class="note" style="margin-top:6px" data-i18n="sofra_note"></p>
        </div>
        <label><span data-i18n="note_lbl"></span><input id="photoNote" data-i18n-ph="note_ph"></label>
        <button class="primary full" id="analyzeBtn" disabled data-i18n="analyze"></button>
        <p class="status" id="aiStatus" hidden></p>
        <p class="err" id="aiErr" hidden></p>
      </div>

      <div class="panel" id="m-yazi" hidden>
        <label><span data-i18n="text_lbl"></span><textarea id="textMeal" data-i18n-ph="text_ph"></textarea></label>
        <button class="primary full" id="textBtn" data-i18n="calc_btn"></button>
        <p class="status" id="textStatus" hidden></p>
        <p class="err" id="textErr" hidden></p>
      </div>

      <div class="panel" id="m-elle" hidden>
        <label><span data-i18n="mname"></span><input id="mName" data-i18n-ph="mname_ph"></label>
        <div class="grid4">
          <label><span data-i18n="kcal_lbl"></span><input id="mK" type="number" inputmode="numeric" min="0"></label>
          <label><span data-i18n="prot_g"></span><input id="mP" type="number" inputmode="numeric" min="0"></label>
          <label><span data-i18n="carb_g"></span><input id="mC" type="number" inputmode="numeric" min="0"></label>
          <label><span data-i18n="fat_g"></span><input id="mF" type="number" inputmode="numeric" min="0"></label>
        </div>
        <button class="primary full" id="manualBtn" data-i18n="add_to_log"></button>
      </div>

      <div class="panel" id="result" hidden>
        <div class="top"><h3 data-i18n="found_h"></h3><span class="tag" id="conf"></span></div>
        <p class="small muted" id="resNote"></p>
        <div id="items"></div>
        <div>
          <p class="small" style="font-weight:600;color:var(--muted);margin-bottom:6px" data-i18n="portion"></p>
          <div class="seg" id="portion" role="group" data-i18n-aria="portion">
            <button aria-pressed="false" data-m="0.75" data-i18n="small"></button>
            <button aria-pressed="true" data-m="1" data-i18n="medium"></button>
            <button aria-pressed="false" data-m="1.3" data-i18n="large"></button>
          </div>
        </div>
        <p class="num" style="font-weight:700" id="resTotal"></p>
        <div style="display:flex;gap:8px">
          <button class="primary" style="flex:1" id="saveRes" data-i18n="add_to_log"></button>
          <button id="discardRes" data-i18n="cancel"></button>
        </div>
        <p class="note" data-i18n="ai_disclaimer"></p>
      </div>
    </div>
  </section>

  <!-- CAFETERIA -->
  <section id="v-yemekhane" class="view" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div><h2 data-i18n="cafe_h"></h2><p class="small muted" data-i18n="cafe_sub"></p></div>
      <div class="tabsmall" id="days" role="group" data-i18n-aria="day_aria"></div>
      <div class="panel">
        <div class="menu-day" id="menuList"></div>
      </div>
      <p class="note" data-i18n="cafe_note"></p>
    </div>
  </section>

  <!-- PROFILE -->
  <section id="v-profil" class="view" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div><h2 data-i18n="plan_h"></h2><p class="small muted" data-i18n="plan_sub"></p></div>
      <div class="panel" id="planCard"></div>
      <div class="panel">
        <h3 data-i18n="calc_h"></h3>
        <dl class="calc" id="calc"></dl>
        <p class="note" data-i18n="calc_note"></p>
      </div>
      <div class="panel" id="aiPanel" hidden>
        <div class="top"><h3 data-i18n="ai_h"></h3><span class="tag" id="gStatus"></span></div>
        <p class="small" data-i18n="ai_p"></p>
        <a class="small" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-i18n="g_link"></a>
        <label><span data-i18n="g_lbl"></span><input id="gkey" type="password" autocomplete="off" spellcheck="false" data-i18n-ph="g_ph"></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="primary" id="gSave" type="button" data-i18n="g_save"></button>
          <button id="gRemove" type="button" data-i18n="g_remove" hidden></button>
        </div>
        <p class="note" data-i18n="g_note"></p>
      </div>
      <button class="primary full" id="redoWiz" type="button" data-i18n="redo"></button>
      <p class="note" data-i18n="med_note"></p>
    </div>
  </section>
</div>

<div class="wiz" id="wiz" hidden role="dialog" aria-modal="true" aria-labelledby="wizQ">

// ================= CALCULATION =================
function calc(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="k"?-161:5);
  const tdee=bmr*ACT[p.activity];
  let goal=p.goal; if(p.age<18&&goal==="lose") goal="keep";
  const rate=goal==="keep"?0:(p.rate||0);
  const d=rate*7700/7;
  const raw=goal==="lose"?tdee-d:goal==="gain"?tdee+d:tdee;
  const floor=p.sex==="k"?1200:1500;
  const target=Math.max(raw,floor);
  const pk=p.diet==="yuksekprotein"?2.2:goal==="keep"?1.4:1.8;
  const prot=pk*p.weight, fat=target*(p.diet==="akdeniz"?.32:.27)/9, carb=Math.max(0,(target-prot*4-fat*9)/4);
  const weeks=goal!=="keep"&&rate&&p.targetWeight?Math.abs(p.targetWeight-p.weight)/rate:0;
  return {bmr,tdee,delta:target-tdee,target,prot,fat,carb,goal,weeks,floored:raw<floor};
}

// Gemini (used when the page is opened outside Claude, e.g. on GitHub Pages)
const GEMINI_MODELS=["gemini-flash-latest","gemini-3.6-flash"];
async function imageB64(file){
  try{
    const img=await createImageBitmap(file);
    const sc=Math.min(1,1280/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return {mime:"image/jpeg",data:c.toDataURL("image/jpeg",.85).split(",")[1]};
  }catch(e){
    return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({mime:file.type||"image/jpeg",data:String(r.result).split(",")[1]});r.onerror=()=>rej({code:"image_rejected"});r.readAsDataURL(file)});
  }
}
async function gemini(prompt,{image,json,signal}={}){
  const parts=[{text:prompt}];
  if(image){const b=await imageB64(image);parts.push({inline_data:{mime_type:b.mime,data:b.data}})}
  const body=JSON.stringify({contents:[{role:"user",parts}],generationConfig:json?{responseMimeType:"application/json"}:{}});
  for(const model of GEMINI_MODELS){
    let r;
    try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":gkey},body,signal})}
    catch(e){throw {code:e&&e.name==="AbortError"?"cancelled":"upstream_error"}}
    if(r.status===404)continue;
    if(r.status===429)throw {code:"rate_limited"};
    if(!r.ok){const j=await r.json().catch(()=>({}));const m=(j.error&&j.error.message)||"";throw {code:/api key|API_KEY|permission/i.test(m)||r.status===401||r.status===403?"bad_key":"upstream_error"}}
    const j=await r.json();
    const txt=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
    if(!txt)throw {code:"empty_completion"};
    return txt;
  }
  throw {code:"upstream_error"};
}
function parseJSON(txt){
  try{return JSON.parse(txt)}catch(e){}
  const a=txt.indexOf("{"),b=txt.lastIndexOf("}");
  if(a>=0&&b>a){try{return JSON.parse(txt.slice(a,b+1))}catch(e){}}
  throw {code:"invalid_json"};
}
const AI={
  async json(prompt,{image,quick}={}){
    if(sample){const o={cache:false};if(image)o.images=[image];if(quick)o.modelTier="quick";return sample.json(prompt,o)}
    return parseJSON(await gemini(prompt,{image,json:true}));
  },
  async text(prompt,{signal,onText}={}){
    if(sample)return sample(prompt,{signal,cache:false,onText});
    const text=await gemini(prompt,{signal});onText&&onText({text});return {text};
  }
};

function todayMenuIdx(){const d=new Date().getDay();return d>=1&&d<=5?d-1:null}

function renderMenu(){
  const days=$("#days"); days.innerHTML="";
  MENU.forEach((m,i)=>{const b=document.createElement("button");b.type="button";b.textContent=m[LANG];b.setAttribute("aria-pressed",i===menuDay);b.onclick=()=>{menuDay=i;renderMenu()};days.append(b)});

  items.forEach((it,i)=>{const pr=it.p*4/it.kcal; let s=c.goal==="keep"?pr-Math.abs(it.kcal-Math.max(left,0)/3)/1000:pr; if(c.goal==="lose")s-=it.f*9/it.kcal*.5; if(it.kcal>Math.max(left,250)+100)s-=1; if(s>bs){bs=s;best=i}});
  const list=$("#menuList"); list.innerHTML="";
  items.forEach((it,i)=>{
    const name=it[LANG];
    const row=document.createElement("div"); row.className="dish";
    const d=document.createElement("div"); d.style.minWidth="0";
    if(i===best){const s=document.createElement("span");s.className="best";s.textContent=t("best");d.append(s)}
    const b=document.createElement("b");b.style.display="block";b.style.fontWeight="600";b.textContent=name;
    const m=document.createElement("span");m.className="small muted num";m.textContent=t("macro_short",{p:it.p,c:it.c,f:it.f});
    d.append(b,m);
    const k=document.createElement("span");k.className="kcal num";k.style.fontWeight="700";k.textContent=it.kcal+" kcal";
    const a=document.createElement("button");a.className="add";a.type="button";a.textContent="+";a.setAttribute("aria-label",t("add_x",{x:name}));
    a.onclick=()=>{addMeals([{...it,name}],"yemekhane");toast(t("added_x",{x:name}));renderMenu()};
    row.append(d,k,a); list.append(row);
  });
}

// ================= PROFILE WIZARD =================
const DIETS=["dengeli","yuksekprotein","vejetaryen","vegan","akdeniz","glutensiz"];
const OBSTS=["duzensiz","yogun","yemekhane","tatli","bilgi"];
const STEPS=["sex","age","body","activity","goal","target","rate","diet","obstacles","ramazan","plan"];
let W=null, wi=0;
const wizSteps=()=>STEPS.filter(s=>!(W.goal==="keep"&&(s==="target"||s==="rate")));
function openWiz(){
  const p=S.demo?{}:S.profile;
  W={sex:p.sex||null,age:p.age||"",height:p.height||"",weight:p.weight||"",activity:p.activity??null,goal:p.goal||null,
     targetWeight:p.targetWeight||"",rate:p.rate||null,diet:p.diet||null,obstacles:[...(p.obstacles||[])],ramazan:p.ramazan??null};
  wi=0; $("#wiz").hidden=false; document.body.style.overflow="hidden"; renderWiz();
}
function closeWiz(){$("#wiz").hidden=true; document.body.style.overflow=""}
$("#wizClose").onclick=closeWiz;
$("#wizBack").onclick=()=>{if(wi>0){wi--;renderWiz()}else closeWiz()};
$("#redoWiz").onclick=openWiz;
$("#startWiz").onclick=openWiz;
function stepValid(s){
  const n=Number;
  switch(s){
    case "sex":return !!W.sex;
    case "age":return n(W.age)>=13&&n(W.age)<=90;
    case "body":return n(W.height)>=120&&n(W.height)<=230&&n(W.weight)>=35&&n(W.weight)<=250;
    case "activity":return W.activity!==null;
    case "goal":return !!W.goal;
    case "target":{const tw=n(W.targetWeight),w=n(W.weight);if(!tw)return false;
      return W.goal==="lose"?(tw<w&&tw>=minHealthy(n(W.height))):(tw>w&&tw<=w+30)}
    case "rate":return !!W.rate;
    case "diet":return !!W.diet;
    case "ramazan":return W.ramazan!==null;
    default:return true;
  }
}
function next(){if(wi<wizSteps().length-1){wi++;renderWiz()}}
function opt(title,sub,pressed,onPick,disabled){
  const b=document.createElement("button");b.type="button";b.className="opt";b.setAttribute("aria-pressed",!!pressed);
  const sp=document.createElement("span");const tt=document.createElement("b");tt.textContent=title;sp.append(tt);
  if(sub){const s=document.createElement("span");s.className="sub";s.textContent=sub;sp.append(s)}
  b.append(sp); if(disabled)b.disabled=true; b.onclick=onPick; return b;
}
function single(key,list){
  const box=document.createElement("div");box.className="opts";
  list.forEach(([v,title,sub,dis])=>box.append(opt(title,sub,W[key]===v,()=>{W[key]=v;renderWiz();setTimeout(next,180)},dis)));
  return box;
}
function numField(id,key,unit,ph,step){
  const wrap=document.createElement("label");wrap.className="biglbl";
  const row=document.createElement("span");row.className="bigrow";
  const i=document.createElement("input");i.id=id;i.type="number";i.inputMode=step?"decimal":"numeric";i.placeholder=ph;i.className="bigin";if(step)i.step=step;
  i.value=W[key];i.oninput=()=>{W[key]=i.value;updFoot()};
  const u=document.createElement("span");u.className="unit";u.textContent=unit;
  row.append(i,u);wrap.append(row);return wrap;
}
function renderWiz(){
  const st=wizSteps(); if(wi>=st.length)wi=st.length-1;
  const s=st[wi];
  $("#wizProg").style.width=Math.round(wi/(st.length-1)*100)+"%";
  const q=$("#wizQ"),sub=$("#wizSub"),body=$("#wizBody");body.innerHTML="";sub.textContent="";
  const w=Number(W.weight),h=Number(W.height);
  switch(s){
    case "sex":q.textContent=t("q_sex");sub.textContent=t("s_sex");
      body.append(single("sex",[["e",t("male")],["k",t("female")]]));break;
    case "age":q.textContent=t("q_age");body.append(numField("wAge","age",t("unit_age"),"21"));break;
    case "body":q.textContent=t("q_body");sub.textContent=t("s_body");
      {const g=document.createElement("div");g.className="opts";g.append(numField("wH","height","cm","175"),numField("wW","weight","kg","70","0.1"));body.append(g)}break;
    case "activity":q.textContent=t("q_act");sub.textContent=t("s_act");
      body.append(single("activity",[0,1,2,3,4].map(i=>[i,t("a"+i+"t"),t("a"+i+"s")])));break;
    case "goal":{q.textContent=t("q_goal");const minor=Number(W.age)<18;
      body.append(single("goal",[["lose",t("gl_t"),t("gl_s"),minor],["keep",t("gk_t"),t("gk_s")],["gain",t("gg_t"),t("gg_s")]]));
      if(minor){const p=document.createElement("p");p.className="note";p.textContent=t("minor_note");body.append(p)}}break;
    case "target":q.textContent=W.goal==="lose"?t("q_tl"):t("q_tg");sub.textContent=t("now_w",{w:fmtKg(w)});
      body.append(numField("wT","targetWeight","kg",String(W.goal==="lose"?Math.max(minHealthy(h),Math.round(w-5)):Math.round(w+5)),"0.1"));
      {const hint=document.createElement("p");hint.className="note";hint.id="tHint";body.append(hint)}break;
    case "rate":{
      q.textContent=t("q_rate");
      const diff=Math.abs(Number(W.targetWeight)-w), ds=fmtKg(+diff.toFixed(1));
      sub.textContent=W.goal==="lose"?t("s_rate_l",{d:ds}):t("s_rate_g",{d:ds});
      let list=W.goal==="lose"?[[.25,"rl0","dl0"],[.5,"rl1","dl1"],[.75,"rl2","dl2"]]:[[.1,"rg0","dg0"],[.25,"rg1","dg1"],[.5,"rg2","dg2"]];
      if(W.goal==="lose")list=list.filter(([r],i)=>i===0||r<=w*0.01);
      body.append(single("rate",list.map(([r,tk,dk])=>{const wk=diff/r;return [r,t("rate_title",{t:t(tk),r:fmtKg(r)}),t("rate_sub",{d:t(dk),dur:fmtDur(wk),date:fmtDate(wk)})]})));
      break;}
    case "diet":q.textContent=t("q_diet");sub.textContent=t("s_diet");
      body.append(single("diet",DIETS.map(k=>[k,t("d_"+k),t("ds_"+k)])));break;
    case "obstacles":q.textContent=t("q_obst");sub.textContent=t("s_obst");
      {const box=document.createElement("div");box.className="opts";
       OBSTS.forEach(k=>box.append(opt(t("o_"+k),"",W.obstacles.includes(k),()=>{W.obstacles=W.obstacles.includes(k)?W.obstacles.filter(x=>x!==k):[...W.obstacles,k];renderWiz()})));
       body.append(box)}break;
    case "ramazan":q.textContent=t("q_ram");sub.textContent=t("s_ram");
      body.append(single("ramazan",[[0,t("no")],[1,t("yes_fast")]]));break;
    case "plan":renderPlanStep(q,sub,body);break;
  }
  $("#wizNext").textContent=s==="plan"?t("start_plan"):s==="obstacles"&&!W.obstacles.length?t("skip"):t("cont");
  updFoot();
  const f=body.querySelector("input");if(f)setTimeout(()=>f.focus({preventScroll:true}),50);
}
function updFoot(){
  const s=wizSteps()[wi];
  $("#wizNext").disabled=!stepValid(s);
  const hint=$("#tHint");
  if(hint){const tw=Number(W.targetWeight),w=Number(W.weight),m=minHealthy(Number(W.height));
    hint.textContent=W.goal==="lose"?(tw&&tw<m?t("h_min",{m}):tw&&tw>=w?t("h_lower"):t("h_minonly",{m}))
      :(tw&&tw<=w?t("h_higher"):tw>w+30?t("h_max30"):t("h_gain"))}
}
$("#wizNext").onclick=()=>{
  const st=wizSteps();
  if(st[wi]==="plan"){savePlan();return}
  if(stepValid(st[wi]))next();
};
function wizProfile(){
  return {sex:W.sex,age:+W.age,height:+W.height,weight:+W.weight,activity:+W.activity,goal:W.goal,
    targetWeight:W.goal==="keep"?null:+W.targetWeight,rate:W.goal==="keep"?null:W.rate,diet:W.diet,obstacles:W.obstacles,ramazan:+W.ramazan};
}
function renderPlanStep(q,sub,body){
  const p=wizProfile(),c=calc(p);
  q.textContent=t("q_plan");
  sub.textContent=c.goal==="keep"?t("plan_keep_sub"):t("plan_goal_sub",{w:fmtKg(p.weight),tw:fmtKg(p.targetWeight),dur:fmtDur(c.weeks),date:fmtDate(c.weeks)});
  const card=document.createElement("div");card.className="panel";
  card.innerHTML=`<div style="text-align:center"><span class="plan-big num">${fmtN(c.target)}</span><p class="muted">${t("kcal_day")}</p></div>
   <div class="grid3 num">
     <div><b style="color:var(--prot)">${r0(c.prot)} g</b><span class="small muted">${t("protein")}</span></div>
     <div><b style="color:var(--carb)">${r0(c.carb)} g</b><span class="small muted">${t("carbs")}</span></div>
     <div><b style="color:var(--fat)">${r0(c.fat)} g</b><span class="small muted">${t("fat")}</span></div>
   </div>`;
  body.append(card);
  const tips=document.createElement("ul");tips.className="tips";
  const li=s=>{const l=document.createElement("li");l.textContent=s;tips.append(l)};
  li(t("tip_bmr",{b:fmtN(c.bmr),t:fmtN(c.tdee)}));
  if(c.goal!=="keep")li(t(c.goal==="lose"?"tip_def":"tip_sur",{k:fmtN(Math.abs(c.delta))}));
  if(c.floored)li(t("tip_floor"));
  li(t("tip_diet",{d:t("d_"+p.diet)})+(p.ramazan?t("tip_ram"):""));
  body.append(tips);
}
function savePlan(){
  const p=wizProfile();
  if(S.demo)S={demo:false,profile:p,logs:{}};else S.profile=p;
  save();closeWiz();toast(t("saved"));go("bugun");renderToday();
}
function renderPlan(){
  const p=S.profile,c=calc(p);
  const rows=[[t("r_sexage"),`${p.sex==="k"?t("female"):t("male")}, ${p.age}`],[t("r_body"),`${p.height} cm, ${fmtKg(p.weight)} kg`],[t("r_act"),t("act"+p.activity)],
    [t("r_goal"),c.goal==="keep"?t("keep_goal"):`${t("goal_"+c.goal)} · ${fmtKg(p.targetWeight)} kg`]];
  if(c.goal!=="keep")rows.push([t("r_pace"),t("pace_val",{r:fmtKg(p.rate),d:fmtDate(c.weeks)})]);
  rows.push([t("r_diet"),t("d_"+(p.diet||"dengeli"))]);
  if(p.obstacles&&p.obstacles.length)rows.push([t("r_obst"),p.obstacles.map(k=>t("o_"+k)).join(", ")]);
  rows.push([t("r_ram"),p.ramazan?t("on"):t("off")]);
  const card=$("#planCard"); card.innerHTML='<dl class="calc"></dl>';
  const dl=card.querySelector("dl");
  rows.forEach(([k,v])=>{const dt=document.createElement("dt");dt.textContent=k;const dd=document.createElement("dd");dd.textContent=v;dl.append(dt,dd)});
  $("#calc").innerHTML=`<dt>${t("c_bmr")}</dt><dd>${fmtN(c.bmr)} kcal</dd>
  <dt>${t("c_act",{a:ACT[p.activity]})}</dt><dd>${fmtN(c.tdee)} kcal</dd>
  <dt>${t("c_adj")}</dt><dd>${c.delta>0?"+":""}${fmtN(c.delta)} kcal</dd>
  <dt class="tot">${t("c_target")}</dt><dd class="tot">${fmtN(c.target)} kcal</dd>
  <dt>${t("protein")}</dt><dd>${r0(c.prot)} g</dd><dt>${t("carbs")}</dt><dd>${r0(c.carb)} g</dd><dt>${t("fat")}</dt><dd>${r0(c.fat)} g</dd>`+
  (c.floored?`<dt style="grid-column:1/-1;color:var(--warn)">${t("floored",{k:fmtN(c.target)})}</dt>`:"");
}

// ================= LANGUAGE SWITCH =================
function setLang(l){
  if(l===LANG) return;
  LANG=l; try{localStorage.setItem(LKEY,l)}catch(e){}
  if(S.demo){S=demoState()}
  applyStatic(); renderAll();
}
function renderAll(){
  renderToday();
  if(!aiReady&&!coachHasText)$("#coachOut").textContent=t("coach_idle");
  setAiUi();
  if(curView==="yemekhane")renderMenu();
  if(curView==="profil")renderPlan();
  if(!$("#wiz").hidden)renderWiz();
  if(res)renderResult(true);
}
$$("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

applyStatic(); renderAll();
})();
</script>
